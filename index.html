</style></head><body><div id="lh-ops-refinement">
  <style>
    #lh-ops-refinement {

    .lh-data-load-config { padding: 18px 20px 22px; background: #f2f3f4; }

    .lh-risk-config-sources { grid-template-columns: 1fr; gap: 14px; }

    .lh-data-selection-actions { display: flex; justify-content: flex-end; margin-top: 12px; }

      const pill = (text, tone='') => `<span class="lh-pill ${tone}">${text}</span>`;
      const issue = (tone, code, heading, detail, action='Open') => `<div class="lh-issue ${tone}"><span class="lh-issue-icon">${tone === 'bad' ? '!' : tone === 'good' ? '✓' : '!'}</span><span><strong>${heading}</strong><small>${detail}</small></span><button class="lh-button small" type="button" data-toast="${code} opened in the issue log.">${action}</button></div>`;
      const check = (tone, heading, detail, status) => `<div class="lh-check"><span class="lh-check-icon ${tone}">${tone === 'warn' || tone === 'bad' ? '!' : '✓'}</span><span><strong>${heading}</strong><small>${detail}</small></span>${pill(status, tone === 'bad' ? 'bad' : tone === 'warn' ? 'warn' : 'good')}</div>`;
      const card = (heading, sub, body, extra='') => `<section class="lh-card ${extra}"><div class="lh-card-head"><div><h3>${heading}</h3>${sub ? `<p>${sub}</p>` : ''}</div></div>${body}</section>`;
      const escapeHtml = value => String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
      const preserveModelTermCase = container => {
        const pattern = /\b(?:LoF|CoF)\b/g;
        const walker = document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) {
          const node = walker.currentNode;
          const parent = node.parentElement;
          if (!parent || parent.closest('script,style,textarea,select,option,.lh-model-term')) continue;
          pattern.lastIndex = 0;
          if (pattern.test(node.nodeValue)) textNodes.push(node);
        }
        textNodes.forEach(node => {
          const fragment = document.createDocumentFragment();
          let lastIndex = 0;
          pattern.lastIndex = 0;
          for (const match of node.nodeValue.matchAll(pattern)) {
            fragment.append(node.nodeValue.slice(lastIndex,match.index));
            const term = document.createElement('span');
            term.className = 'lh-model-term';
            term.textContent = match[0];
            fragment.append(term);
            lastIndex = match.index + match[0].length;
          }
          fragment.append(node.nodeValue.slice(lastIndex));
          node.replaceWith(fragment);
        });
      };
      const transferControlState = valid => dataTransferValues.checkAttempted ? valid ? 'is-valid' : 'is-invalid' : '';
      const isPhase3 = () => planPhase === '3';
      const lofConfigurationSource = () => planPhase === '1' ? 'uploaded JSON configuration' : 'guided configuration';
      const dataTransferSummary = () => {
        if (!isPhase3()) return {scope:'Fixed data load · 31 tables',rows:'11.3 million',runtime:'18–24 min'};
        if (dataTransferValues.scope === 'full') return {scope:'Full data load · 31 tables',rows:'11.3 million',runtime:'18–24 min'};
        if (dataTransferValues.scope === 'tables') return {scope:`Individual tables · ${dataTransferValues.selectedTables.length} tables`,rows:'420,000',runtime:'4–7 min'};
        const tableCounts = {dbo:3,domain:10,events:5,pipeline:8,gis:5};
        const tableCount = dataTransferValues.selectedGroups.reduce((total,group) => total + tableCounts[group],0);
        return {scope:`${dataTransferValues.selectedGroups.length} groups · ${tableCount} tables`,rows:'11.3 million',runtime:'18–24 min'};
      };
      const dataTransferReadiness = () => {
        const summary = dataTransferSummary();
        return `
          <div class="lh-value-row"><span>Transfer name</span><strong>${escapeHtml(dataTransferValues.name)}</strong><span></span></div>
          <div class="lh-value-row"><span>Scope</span><strong>${summary.scope}</strong><span></span></div>
          <div class="lh-value-row"><span>Estimated rows</span><strong>${summary.rows}</strong><span></span></div>
          <div class="lh-value-row"><span>Estimated runtime</span><strong>${summary.runtime}</strong><span></span></div>`;
      };
      const dataTransferModal = () => !dataTransferModalOpen ? '' : `
        <div class="lh-modal-backdrop" data-transfer-modal-backdrop>
          <section class="lh-modal" role="dialog" aria-modal="true" aria-labelledby="lh-transfer-modal-title" data-transfer-modal>
            <header class="lh-modal-head"><h2 id="lh-transfer-modal-title">Ready to Load</h2><button class="lh-modal-close" type="button" aria-label="Close transfer details" data-transfer-modal-close>×</button></header>
            <div class="lh-modal-body">${dataTransferReadiness()}</div>
            <footer class="lh-modal-footer"><button class="lh-button" type="button" data-transfer-modal-close>Cancel</button><button class="lh-button primary" type="button" data-transfer-start>Start Data Load</button></footer>
          </section>
        </div>`;
      const dataTransferGroups = [
        ['dbo','DBO Tables','3 tables','07/12/2021, 10:32 AM','Shaki Muttiah'],
        ['domain','Domain Tables','10 tables','07/12/2021, 10:32 AM','Shaki Muttiah'],
        ['events','Events Tables','5 tables','07/12/2021, 10:32 AM','Shaki Muttiah'],
        ['pipeline','Pipeline Tables','8 tables','07/12/2021, 10:32 AM','Shaki Muttiah'],
        ['gis','GIS Tables','5 tables','07/12/2021, 10:32 AM','Shaki Muttiah']
      ];
      const dataLoadColumns = scope => scope === 'tables'
        ? [['name','Table'],['group','Data Group'],['transferred','Last Transferred'],['lastRanBy','Last Ran By']]
        : [['name','Data Group'],['source','Source Entities'],['transferred','Last Transferred'],['lastRanBy','Last Ran By']];
      const visibleDataLoadColumn = key => !dataLoadHiddenColumns.has(key);
      const sortDataLoadRows = rows => {
        if (!dataLoadSort.column) return rows;
        const direction = dataLoadSort.direction === 'desc' ? -1 : 1;
        return [...rows].sort((a,b) => String(a[dataLoadSort.column]).localeCompare(String(b[dataLoadSort.column]),undefined,{numeric:true}) * direction);
      };
      const dataLoadColumnMenuContent = columns => `
        <button type="button" data-data-load-sort="asc"><span class="lh-data-load-menu-icon">↑</span><span>Sort Ascending</span></button>
        <button type="button" data-data-load-sort="desc"><span class="lh-data-load-menu-icon">↓</span><span>Sort Descending</span></button>
        <button type="button" data-data-load-choose-columns><span class="lh-data-load-menu-icon">▥</span><span>Choose Columns</span></button>
        ${dataLoadColumnChooserOpen ? `<div class="lh-data-load-column-options">${columns.map(([key,label]) => `<label class="lh-data-load-column-option"><input type="checkbox" data-data-load-column="${key}" ${visibleDataLoadColumn(key) ? 'checked' : ''}/><span>${label}</span></label>`).join('')}</div>` : ''}`;
      const dataLoadHeader = (key,label,columns) => {
        const open = dataLoadColumnMenu === key;
        const sortIndicator = dataLoadSort.column === key ? `<span class="lh-data-load-sort-indicator">${dataLoadSort.direction === 'asc' ? '↑' : '↓'}</span>` : '';

      };
      const dataLoadTable = (scope,selectable) => {
        const columns = dataLoadColumns(scope);
        const visibleColumns = columns.filter(([key]) => visibleDataLoadColumn(key));
        const rows = scope === 'tables'
          ? transferTables.map(([name,group]) => ({key:name,name,group,transferred:'07/12/2021, 10:32 AM',lastRanBy:'Shaki Muttiah'}))

      };
      const dataSelection = () => {

              </div>

            </div>
          </section>

          ${lofConfigErrorModal()}
        </div>` : planPhase === '2' ? `
        <div class="lh-screen">
          <section class="lh-run-config-layout lh-guided-config-layout">
            <div class="lh-run-config-info">
              <div class="lh-kicker">Configuration</div>
              <div class="lh-fields">
                <label class="lh-field"><span class="lh-field-label">LoF Name</span><input class="lh-input ${lofGeneralControlState(lofGeneralValues.name)}" data-lof-general="name" value="${escapeHtml(lofGeneralValues.name)}" placeholder="Enter a name for this LoF run" ${lofConfigCheckAttempted && lofConfigValueMissing(lofGeneralValues.name) ? 'aria-invalid="true"' : ''}/><span class="lh-help">Used to identify this LoF run in results and run history</span></label>
                <label class="lh-field"><span class="lh-field-label">Reason for LoF</span><input class="lh-input ${lofGeneralControlState(lofGeneralValues.reason)}" data-lof-general="reason" value="${escapeHtml(lofGeneralValues.reason)}" placeholder="Enter the reason for this LoF run" ${lofConfigCheckAttempted && lofConfigValueMissing(lofGeneralValues.reason) ? 'aria-invalid="true"' : ''}/><span class="lh-help">Stored with the configuration and run log</span></label>

          ${lofConfigErrorModal()}
        </div>`;

      const lofProgressStepMs = 2000;

        'Clear previous LoF data',
        'Verify LoF feature is enabled',
        'Validate JSON configuration',
        'Process LoF Models'
      ];
      const lofRunDurationMs = lofProgressSteps.length * lofProgressStepMs;
      const lofRunSnapshot = () => {
        const elapsedMs = lofProgressRun ? Math.min(lofRunDurationMs, Math.max(0, Date.now() - lofProgressRun.startedAt)) : 0;
        const failed = lofProgressRun?.validationStatus === 'failed';
        const complete = Boolean(lofProgressRun) && !failed && elapsedMs >= lofRunDurationMs;
        const visibleStatusCount = lofProgressRun ? failed ? 3 : Math.min(lofProgressSteps.length, Math.floor(elapsedMs / lofProgressStepMs) + 1) : 0;
        const overallProgress = failed ? 50 : complete ? 100 : Math.min(99, Math.floor(elapsedMs / lofRunDurationMs * 100));
        const modelElapsedMs = Math.max(0,elapsedMs - lofProgressStepMs * 3);
        const modelProgress = Math.min(1,modelElapsedMs / lofProgressStepMs);
        return {
          elapsedMs,
          failed,
          complete,
          overallProgress,
          visibleStatusCount,
          processedSegments:Math.round(lofSegmentCount * modelProgress)
        };
      };
      const lofDurationMinutes = elapsedMs => Math.max(0,Math.round(elapsedMs / 60000));
      const lofDurationLabel = elapsedMs => formatDurationMinutes(lofDurationMinutes(elapsedMs));
      const lofSegmentsLabel = segments => segments >= 1000000 ? `${(segments / 1000000).toFixed(1)}M` : segments.toLocaleString();
      const lofStatusRows = snapshot => lofProgressSteps.slice(0,snapshot.visibleStatusCount).map((description,index) => {

        const status = snapshot.failed && index === 2

          : snapshot.complete || !isCurrent

          try {
            config = JSON.parse(lofProgressRun.configText);
          } catch (error) {
            throw new Error(lofJsonSyntaxIssue(lofProgressRun.configText,error));
          }
          validatePhaseOneLofConfig(config);
          lofProgressRun.validationStatus = 'valid';

        showToast(moduleName === 'log' ? 'New issue form opened.' : moduleName === 'data' && viewName === 'compare' ? dataViewSection === 'loaded-data' ? 'Lighthouse Data Export opened for loaded data.' : dataViewSection === 'risk-results' ? 'Lighthouse Data Export opened for risk results.' : dataViewSection === 'factors' ? 'Lighthouse Data Export opened for factor data.' : riskExtractSheet ? `${currentRiskSheet().name} is ready for sanitized prototype export.` : `Lighthouse Data Export opened for the ${riskExtractModel === 'lof' ? 'LoF' : 'CoF'} Refinement catalog.` : viewName === 'compare' ? moduleName === 'lof' ? 'LoF comparison refreshed using the GitHub PHMSA benchmark and optional previous result.' : moduleName === 'cof' ? 'CoF comparison refreshed using prior output and illustrative PHMSA prototype data pending a real benchmark.' : `${comparisonProfiles[moduleName].name} comparison refreshed using the uploaded previous and PHMSA results.` : moduleName === 'data' && viewName === 'run' ? 'DTL-081 queued for pre-transfer validation.' : moduleName === 'lof' && viewName === 'run' ? `LOF-025 setup validated with the ${lofConfigurationSource()} and PHMSA connection.` : moduleName === 'risk' && viewName === 'run' ? 'RISK-0264-011 submitted through the authenticated Lighthouse session.' : 'Action opened for the current workflow.');
      });
      render();
    })();
  </script>
</div>
</body></html>
