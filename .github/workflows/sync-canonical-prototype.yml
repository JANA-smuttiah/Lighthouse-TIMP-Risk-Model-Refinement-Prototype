name: Sync canonical prototype

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-canonical-prototype
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pages repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download canonical prototype
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github.raw+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output index.html.canonical \
            "https://api.github.com/repos/JANA-Technology/Lighthouse-TIMP-Product/contents/prototypes/risk-model-refinement/lighthouse-operations-refinement-views-timp.html?ref=main"

      - name: Commit and push when changed
        shell: bash
        run: |
          if cmp --silent index.html index.html.canonical; then
            echo "index.html already matches the canonical prototype."
            rm index.html.canonical
            exit 0
          fi

          mv index.html.canonical index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync canonical prototype"
          git push origin HEAD:main
